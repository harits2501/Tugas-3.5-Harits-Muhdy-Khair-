<!DOCTYPE html>
<html lang="id" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechNova AI - Landing Page Startup</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Konfigurasi Dark Mode -->
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <!-- CSS Mode Terang -->
    <style>
        html {
            scroll-behavior: smooth;
        }

        html:not(.dark) body {
            background-color: #f8fafc;
            color: #1e293b;
        }

        html:not(.dark) nav,
        html:not(.dark) footer,
        html:not(.dark) #features {
            background-color: #e2e8f0 !important;
            border-color: #cbd5e1 !important;
        }

        html:not(.dark) .bg-slate-950 {
            background-color: #f8fafc !important;
        }

        html:not(.dark) .bg-slate-900 {
            background-color: #e2e8f0 !important;
        }

        html:not(.dark) .bg-slate-800 {
            background-color: #cbd5e1 !important;
        }

        html:not(.dark) .text-slate-100,
        html:not(.dark) .text-slate-300 {
            color: #1e293b !important;
        }

        html:not(.dark) .text-slate-400,
        html:not(.dark) .text-slate-500 {
            color: #475569 !important;
        }

        html:not(.dark) .border-slate-800,
        html:not(.dark) .border-slate-700 {
            border-color: #cbd5e1 !important;
        }

        html:not(.dark) .hover\:bg-slate-800:hover {
            background-color: #cbd5e1 !important;
        }

        html:not(.dark) .bg-indigo-900 {
            background-color: #dbeafe !important;
        }

        html:not(.dark) .text-indigo-200 {
            color: #1e40af !important;
        }

        html:not(.dark) .text-indigo-300 {
            color: #1e40af !important;
        }

        html:not(.dark) .bg-purple-900 {
            background-color: #ede9fe !important;
        }

        html:not(.dark) .bg-pink-900 {
            background-color: #fce7f3 !important;
        }

        html:not(.dark) .bg-gradient-to-br {
            background-image: linear-gradient(to bottom right, #dbeafe, #e2e8f0, #ede9fe) !important;
        }

        html:not(.dark) .border-indigo-800 {
            border-color: #c7d2fe !important;
        }

        html:not(.dark) .border-indigo-500 {
            border-color: #6366f1 !important;
        }

        html:not(.dark) .text-green-400 {
            color: #15803d !important;
        }
    </style>


</head>

<body class="bg-slate-950 text-slate-100 font-sans transition duration-300">

    <!-- 1. NAVBAR -->
    <nav class="sticky top-0 z-50 bg-slate-900 border-b border-slate-800">

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">

            <!-- Bagian Atas Navbar -->
            <div class="flex items-center justify-between">

                <!-- Logo -->
                <h1 class="text-xl font-bold text-indigo-400">
                    TechNova.AI
                </h1>

                <!-- Tombol -->
                <div class="flex items-center gap-3">

                    <!-- Dark Mode -->
                    <button id="themeButton" onclick="toggleTheme()"
                        class="px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700">
                        ☀
                    </button>

                    <!-- Burger -->
                    <button onclick="document.getElementById('menu').classList.toggle('hidden')"
                        class="px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700">
                        ☰
                    </button>

                    <!-- CTA -->
                    <a href="#pricing"
                        class="hidden sm:block bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-lg text-sm">
                        Coba Gratis
                    </a>

                </div>

            </div>

            <!-- Menu Dropdown ke Bawah -->
            <div id="menu"
                class="hidden flex flex-col gap-4 mt-4 p-4 bg-slate-800 rounded-xl text-sm text-slate-300">

                <a href="#hero" class="hover:text-indigo-400">
                    Beranda
                </a>

                <a href="#features" class="hover:text-indigo-400">
                    Fitur
                </a>

                <a href="#pricing" class="hover:text-indigo-400">
                    Harga
                </a>

            </div>

        </div>
    </nav>


</body>
</html>
